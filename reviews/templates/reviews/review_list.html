{% extends 'reviews/base.html' %}

{% block title %} <h1>All reviews</h1> {% endblock %}
{% block content %}

    <ul>
    {% for review in reviews %}
        <li>
            <a href="{% url 'reviews:review-detail' review.id %}">>{{ review.username }} (Rating: {{ review.rating }})</a>
        </li>
    {% endfor %}
    </ul>

{% endblock %}
