{% extends 'reviews/base.html' %}
{% load static %}
{% block title %}<title>Your review</title> {% endblock %}

{% block content %}
    <form method="POST" action="/" novalidate>
        {% csrf_token %}
        {% for field in form %}
            <div class="form-control {% if form.field.errors %} errors {% endif %}">
                {{ field.label_tag }}
                {{ field }}
                {{ field.errors }}
            </div>
        {% endfor %}
        <button type="submit">Send</button>
    </form>
{% endblock %}
